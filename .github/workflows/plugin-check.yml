name: WordPress compatibility

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    uses: nikolareljin/ci-helpers/.github/workflows/wp-plugin-check.yml@production
    with:
      plugin_slug: nr-post-exporter
      compose_file: ''
      versions: >-
        [{"wp":"5.8","php":"7.4"},{"wp":"6.9","php":"8.2"},{"wp":"7.0","php":"8.3"},{"wp":"7.1","php":"8.4"}]
      meta_check_script: test/wpcli-plugin-meta-check.php
      fail_on_findings: true
      upload_artifact: true
