name: Security

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer audit --no-interaction

  foxguard:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: 0sec-labs/foxguard/action@f20b226a92f783c03a03c1654d10779939e9c9c5
        with:
          path: .
          severity: medium
          fail-on-findings: 'true'
          upload-sarif: 'true'
