name: PHPCS

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  phpcs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dev dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs -p -s -d memory_limit=512M --standard=./phpcs.xml .

      - name: Check project site is in sync
        run: bash bin/update-docs.sh --check
