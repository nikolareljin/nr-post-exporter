name: I18N POT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  make-pot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.2'

      - name: Install WP-CLI
        run: |
          curl -fL -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install i18n command
        run: wp package install wp-cli/i18n-command:*

      - name: Generate POT file
        run: |
          wp i18n make-pot . languages/nr-post-exporter.pot \
            --slug=nr-post-exporter \
            --exclude=".git,.github,.build,vendor,test,node_modules" \
            --headers='{"Report-Msgid-Bugs-To":"https://github.com/nikolareljin/nr-post-exporter/issues"}'

      - name: Upload POT artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i18n-pot
          path: languages/nr-post-exporter.pot
          if-no-files-found: error

  create-pot-pr:
    needs: make-pot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download POT artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: i18n-pot
          path: .

      - name: Create POT update PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          commit-message: "chore(i18n): update POT"
          title: "Update POT for translations"
          body: "Automated POT regeneration via CI."
          branch: chore/update-pot
          add-paths: |
            languages/nr-post-exporter.pot
